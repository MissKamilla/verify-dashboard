services:
  postgres:
    image: postgres:16-alpine
    container_name: verify_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: verify_user
      POSTGRES_PASSWORD: verify_password
      POSTGRES_DB: verify_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: verify_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data

  postgres-test:
    image: postgres:16-alpine
    container_name: verify_postgres_test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: verify_test_user
      POSTGRES_PASSWORD: verify_test_password
      POSTGRES_DB: verify_dashboard_test

volumes:
  postgres_data:
  redis_data:
