services:
  postgres:
    image: postgres:16-alpine
    container_name: verify_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: verify_user
      POSTGRES_PASSWORD: verify_password
      POSTGRES_DB: verify_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: